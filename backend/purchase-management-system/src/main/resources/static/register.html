<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UJA Purchase Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-bar"></div>
            <h4 class="mb-1">Create Account</h4>
            <p class="text-muted mb-4">University of Jaén — Purchase Management</p>

            <div id="msgBox" class="alert d-none"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="role" required>
                        <option value="TEACHER">Teacher / Teaching staff</option>
                        <option value="EXPENDITURE_UNIT_HEAD">Expenditure Unit Head</option>
                        <option value="MANAGEMENT">Management staff</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" id="departmentId" required>
                        <option value="">Loading departments...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-uja w-100">Register</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login.html" class="small text-decoration-none">Already have an account? Sign in</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
