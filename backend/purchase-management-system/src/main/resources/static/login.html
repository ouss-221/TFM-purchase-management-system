<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJA - Purchase Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-bar"></div>
            <h4 class="mb-1">Purchase Management</h4>
            <p class="text-muted mb-4">University of Jaén</p>

            <div id="errorMsg" class="alert alert-danger d-none"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-uja w-100">Sign In</button>
            </form>

            <div class="text-center mt-3">
                <a href="/register.html" class="small text-decoration-none">No account? Register here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
